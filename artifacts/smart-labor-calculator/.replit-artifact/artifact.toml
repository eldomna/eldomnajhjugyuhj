kind = "web"
previewPath = "/"
title = "Smart Labor Calculator"
description = "A labor-law calculator app for Yemen and Saudi Arabia with authentication, free calculation, subscriptions, receipt-based payments, and admin review — imported from an existing project."
version = "1.0.0"
id = "artifacts/smart-labor-calculator"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/api" ]
localPort = 20649

[services.development]
run = "pnpm --filter @workspace/smart-labor-calculator run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/smart-labor-calculator", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "node", "artifacts/smart-labor-calculator/dist/server/index.mjs" ]

[services.production.run.env]
PORT = "20649"
NODE_ENV = "production"

[services.env]
PORT = "20649"
BASE_PATH = "/"
